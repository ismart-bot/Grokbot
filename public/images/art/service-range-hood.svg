<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2d2d2f"/>
      <stop offset="1" stop-color="#161617"/>
    </linearGradient>
    <linearGradient id="steel" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#46474a"/>
      <stop offset="0.3" stop-color="#8c8d91"/>
      <stop offset="0.6" stop-color="#6a6b6f"/>
      <stop offset="1" stop-color="#3b3c3f"/>
    </linearGradient>
    <linearGradient id="under" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b5c60"/>
      <stop offset="1" stop-color="#2a2a2c"/>
    </linearGradient>
    <pattern id="baffle" width="36" height="36" patternUnits="userSpaceOnUse" patternTransform="rotate(35)">
      <rect width="36" height="36" fill="#4a4b4e"/>
      <rect width="18" height="36" fill="#6d6e72"/>
      <rect x="16" width="2" height="36" fill="#9fa0a4"/>
    </pattern>
    <radialGradient id="light" cx="0.5" cy="0.5" r="0.5">
