<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a3a3d"/>
      <stop offset="1" stop-color="#18181a"/>
    </linearGradient>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e6e6e9"/>
      <stop offset="0.25" stop-color="#7a7a7e"/>
      <stop offset="0.5" stop-color="#c9c9cd"/>
      <stop offset="0.75" stop-color="#4c4c50"/>
      <stop offset="1" stop-color="#9a9a9e"/>
    </linearGradient>
    <radialGradient id="drum" cx="0.45" cy="0.4" r="0.65">
      <stop offset="0" stop-color="#5b5c60"/>
      <stop offset="0.7" stop-color="#2a2a2d"/>
      <stop offset="1" stop-color="#121213"/>
    </radialGradient>
    <pattern id="perf" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="13" cy="13" r="4" fill="#0e0e0f" opacity="0.75"/>
      <circle cx="12" cy="12" r="4" fill="none" stroke="#fff" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="0.35" stop-color="#fff" stop-opacity="0.02"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="porthole">
      <circle cx="640" cy="470" r="270"/>
    </clipPath>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect x="0" y="0" width="1200" height="120" fill="#2c2c2e"/>
  <path d="M0 120 H1200" stroke="#555558" stroke-width="2"/>
  <circle cx="140" cy="60" r="26" fill="none" stroke="#9a9a9e" stroke-width="3" opacity="0.6"/>
  <rect x="820" y="44" width="200" height="32" rx="6" fill="#141415"/>
  <rect x="836" y="57" width="90" height="6" rx="3" fill="#63C6C1" opacity="0.85"/>
  <circle cx="640" cy="470" r="360" fill="#1e1e20"/>
  <circle cx="640" cy="470" r="340" fill="none" stroke="url(#chrome)" stroke-width="40"/>
  <circle cx="640" cy="470" r="300" fill="#141415"/>
  <g clip-path="url(#porthole)">
    <circle cx="640" cy="470" r="270" fill="url(#drum)"/>
    <rect x="360" y="190" width="560" height="560" fill="url(#perf)"/>
    <path d="M500 250 L560 470 L500 690" fill="none" stroke="#6b6c70" stroke-width="18" stroke-linecap="round" opacity="0.5"/>
    <path d="M800 260 L730 470 L800 680" fill="none" stroke="#6b6c70" stroke-width="18" stroke-linecap="round" opacity="0.35"/>
    <circle cx="640" cy="470" r="270" fill="url(#glass)"/>
  </g>
  <circle cx="640" cy="470" r="286" fill="none" stroke="#63C6C1" stroke-width="4" opacity="0.8" filter="url(#glow)"/>
  <circle cx="640" cy="470" r="286" fill="none" stroke="#bff0ec" stroke-width="1.5" opacity="0.8"/>
  <path d="M430 300 A270 270 0 0 1 600 205" fill="none" stroke="#fff" stroke-width="10" stroke-linecap="round" opacity="0.14"/>
</svg>
