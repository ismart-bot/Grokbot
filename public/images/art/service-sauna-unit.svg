    <ellipse cx="380" cy="478" rx="72" ry="48" fill="url(#stone)"/>
    <ellipse cx="500" cy="486" rx="66" ry="44" fill="url(#stone)"/>
    <ellipse cx="620" cy="480" rx="70" ry="46" fill="url(#stone)"/>
    <ellipse cx="700" cy="494" rx="52" ry="36" fill="url(#stone)"/>
    <ellipse cx="325" cy="440" rx="58" ry="38" fill="url(#stone)"/>
    <ellipse cx="445" cy="432" rx="64" ry="42" fill="url(#stone)"/>
    <ellipse cx="565" cy="436" rx="60" ry="40" fill="url(#stone)"/>
    <ellipse cx="660" cy="446" rx="50" ry="34" fill="url(#stone)"/>
    <ellipse cx="505" cy="392" rx="54" ry="36" fill="url(#stone)"/>
