    <path d="M40 900 C40 820 120 780 100 700 C90 640 150 600 150 540 L230 560 C220 640 170 670 190 740 C210 810 150 850 160 900 Z" opacity="0.14"/>
  </g>
  <rect x="800" y="250" width="250" height="400" rx="22" fill="url(#panel)" stroke="#5a5b5f" stroke-width="2"/>
  <circle cx="925" cy="400" r="86" fill="#141415" stroke="#4a4b4e" stroke-width="2"/>
  <circle cx="925" cy="400" r="70" fill="none" stroke="#63C6C1" stroke-width="5" opacity="0.8" filter="url(#glow)"/>
  <path d="M925 330 A70 70 0 1 1 864 435" fill="none" stroke="#c6f2ee" stroke-width="3" stroke-linecap="round"/>
  <circle cx="925" cy="400" r="14" fill="#63C6C1" opacity="0.8"/>
