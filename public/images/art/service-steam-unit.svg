<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#303033"/>
      <stop offset="1" stop-color="#151516"/>
    </linearGradient>
    <pattern id="tile" width="150" height="150" patternUnits="userSpaceOnUse">
      <rect width="150" height="150" fill="none" stroke="#fff" stroke-opacity="0.05" stroke-width="2"/>
    </pattern>
    <filter id="steam" x="-30%" y="-30%" width="160%" height="160%">
