    </filter>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3f4043"/>
      <stop offset="1" stop-color="#1c1c1e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="900" fill="url(#bg)"/>
  <rect width="1200" height="900" fill="url(#tile)"/>
  <g filter="url(#steam)" fill="#e9ecec">
    <path d="M140 900 C120 760 260 700 230 580 C200 470 320 400 300 300 C290 240 360 190 380 120 L520 120 C500 220 430 260 450 340 C470 430 350 500 390 610 C430 720 300 780 330 900 Z" opacity="0.2"/>
